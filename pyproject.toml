[project]
name = "cmp-plotter"
version = "0.2.0"
description = "A vibe coded tool for creating plots for Condensed Matter Physics"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alex Quarry", email = "52108977+Quarrinexus@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
]

[project.scripts]
cmp-plotter = "cmp_plotter:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
